<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time for Wrist Wrestling!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #4FC3F7; /* Sky Blue */
            --surface: rgba(255, 255, 255, 0.9);
            --text: #01579B; /* Dark Blue Text */
            --text-secondary: #0288D1;
            --primary: #FFCA28; /* Chest Yellow */
            --primary-shadow: #FFA000;
            --accent: #F06292; /* Pink Accent */
            --border: #B3E5FC;
            --font-main: 'M PLUS Rounded 1c', sans-serif;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg);
            /* Removed pattern for pure color */
            background-image: none; 
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- Dashboard Layer (Anime Style) --- */
        #dashboard-layer {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            transition: opacity 0.3s;
            overflow-y: auto; /* Allow scrolling if content is too tall */
            scrollbar-width: none; /* Hide scrollbar for cleaner look */
        }
        #dashboard-layer::-webkit-scrollbar { display: none; }

        header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            z-index: 10;
            flex-shrink: 0; /* Don't shrink header */
        }

        h1 {
            font-size: 2.8rem; /* Increased size for visual weight */
            font-weight: 900;
            color: var(--primary); /* Yellow */
            -webkit-text-stroke: 2.5px #fff; /* Thicker white outline */
            paint-order: stroke fill; /* Ensures stroke doesn't eat into the yellow fill */
            text-shadow: 3px 3px 0 #fff, 0 6px 6px rgba(0,0,0,0.15);
            margin: 10px 0;
            text-align: center;
            letter-spacing: 2px; /* Slightly wider stance */
            text-transform: uppercase;
            animation: titlePulse 2s infinite ease-in-out;
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .score-board {
            display: flex;
            gap: 15px;
            background: var(--surface);
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            border: 4px solid #fff;
        }

        .score-item {
            text-align: center;
        }
        .score-item .label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
        }
        .score-item .value {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--text);
        }

        #game-area-preview {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100%;
        }

        #wrist-circle-preview {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2); /* Transparent white */
            border: 8px solid #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(5px);
        }
        
        /* 3D Hand Icon - Enhanced for realism based on user request */
        .hand-icon {
            font-size: 140px;
            line-height: 1;
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.2));
            transform: scale(1.2);
            animation: handFloat 3s ease-in-out infinite;
            /* Peach skin tone simulation using text-shadow or emoji modifiers if supported, 
               but CSS filter is better for consistent vibe */
        }
        
        .controls {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-direction: column;
            align-items: center;
            position: relative; 
            z-index: 20; /* Ensure above background elements */
            flex-shrink: 0; /* Ensure controls don't shrink and disappear */
        }

        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 15px 60px;
            font-size: 1.5rem;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--primary-shadow);
            transition: transform 0.1s, box-shadow 0.1s;
            text-transform: uppercase;
            font-family: var(--font-main);
            min-width: 200px;
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 var(--primary-shadow);
        }

        .tap-label {
            /* Position relative to controls container now */
            position: relative;
            bottom: auto;
            width: 100%;
            text-align: center;
            font-size: 1.8rem; /* Slightly larger */
            font-weight: 900;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            animation: bounce 1s infinite;
            margin-bottom: 15px; /* Spacing above button */
            pointer-events: none; /* Critical fix: Allow clicks to pass through label */
            z-index: 25; /* Visual layer above, but click-through */
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        #timer-status {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.9);
            font-weight: 700;
            margin-top: 10px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        /* --- Game Container (Functional) --- */
        #game-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff;
            z-index: 50;
        }
        
        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        #fireworks-canvas { pointer-events: none; z-index: 60; }
        #game-canvas { z-index: 55; }

        /* Game UI Overlay */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 70;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }

        .score-display {
            font-size: 3rem;
            font-weight: 900;
            color: var(--text);
            text-shadow: 2px 2px 0 #fff;
        }

        #quit-btn {
            background: #fff;
            border: 2px solid var(--text);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 900;
            cursor: pointer;
            font-family: var(--font-main);
            box-shadow: 0 4px 0 #ccc;
        }
        #quit-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #ccc;
        }

        #task-toast {
            position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%);
            background: var(--surface); padding: 20px 40px; border-radius: 50px;
            font-weight: 900; font-size: 2rem; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 4px solid var(--primary); 
            color: var(--text); 
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
        }
        @keyframes popIn { from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

        .timer-bar {
            position: absolute; top: 0; left: 0; width: 100%; height: 8px; background: rgba(0,0,0,0.1); z-index: 80;
        }
        #timer-fill {
            width: 100%; height: 100%; background: var(--accent);
            transition: width 0.1s linear;
        }

        /* Power Gauge */
        #power-gauge {
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 400px; height: 20px; 
            background: rgba(0,0,0,0.1); border-radius: 10px; overflow: hidden;
            border: 2px solid #fff;
        }
        #power-fill {
            width: 50%; height: 100%; background: var(--primary); 
            transition: width 0.1s ease-out;
        }
        #center-marker {
            position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: #fff; z-index: 2;
        }

        /* Feedback Modal */
        #feedback-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: #fff;
            border-radius: 30px;
            padding: 30px;
            border: 6px solid var(--primary);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            text-align: center;
            width: 90%;
            max-width: 400px;
            animation: slideUp 0.4s;
        }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-content h1 {
            color: var(--text);
            font-size: 2.5rem;
            margin-bottom: 5px;
        }
        
        .feedback-btns {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }
        
        .fb-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid #eee;
            background: #fff;
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-main);
        }
        .fb-btn:hover { transform: scale(1.05); }
        .fb-btn.selected {
            border-color: var(--primary);
            background: #FFF8E1;
            color: var(--text);
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(255, 202, 40, 0.3);
        }

        #user-notes {
            width: 100%;
            padding: 15px;
            border: 2px solid #eee;
            border-radius: 15px;
            font-family: var(--font-main);
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        #ai-analysis {
            background: #F1F8E9;
            border-radius: 15px;
            padding: 15px;
            color: #33691E;
            font-size: 0.9rem;
            line-height: 1.5;
            text-align: left;
            border: 2px dashed #C5E1A5;
            margin-top: 15px;
        }

        /* Utility */
        .hidden { display: none !important; }
        
        /* Spinner */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s infinite linear;
            margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <!-- Anime Dashboard -->
    <div id="dashboard-layer">
        <header>
            <h1>Time for Wrist Wrestling!</h1>
            <div class="score-board">
                <div class="score-item">
                    <div class="label">Level</div>
                    <div class="value" id="diff-display">1</div>
                </div>
                <div class="score-item">
                    <div class="label">Last Score</div>
                    <div class="value" id="last-score">-</div>
                </div>
                <div class="score-item">
                    <div class="label">Next</div>
                    <div class="value" id="next-reminder">45m</div>
                </div>
            </div>
        </header>

        <div id="game-area-preview">
            <div id="wrist-circle-preview">
                <!-- 3D Hand Icon -->
                <div class="hand-icon">🤝</div>
            </div>
        </div>

        <div class="controls">
            <div class="tap-label">Tap! Tap!</div>
            <button class="btn" id="start-btn" onclick="app.startGame()">TAP TO START</button>
            <div id="timer-status">
                <p>Notifications Active</p>
            </div>
        </div>
    </div>

    <!-- Functional Game Container (Restored) -->
    <div id="game-container" class="hidden">
        <canvas id="game-canvas"></canvas>
        <canvas id="fireworks-canvas"></canvas>
        <div class="timer-bar"><div id="timer-fill"></div></div>
        
        <div id="ui-layer">
            <div class="header-bar">
                <div class="score-display" id="score-display">0</div>
                <button id="quit-btn">QUIT</button>
            </div>

            <div id="task-toast" class="hidden">READY</div>

            <div id="power-gauge">
                <div id="center-marker"></div>
                <div id="power-fill"></div>
            </div>
        </div>
    </div>

    <!-- Feedback Modal -->
    <div id="feedback-modal" class="hidden">
        <div class="modal-content">
            <h1 id="result-title">Victory!</h1>
            <p style="color:var(--text-secondary); font-weight:700;">Score: <span id="final-score" style="color:var(--primary); font-size:1.5rem;">0</span></p>
            
            <div id="user-input-area" style="margin-top:20px;">
                <p style="text-align:left; font-size:0.8rem; font-weight:700; color:var(--text); margin-bottom:5px; text-transform:uppercase;">How do you feel?</p>
                
                <div class="feedback-btns">
                    <button class="fb-btn" onclick="app.selectFeedback('good', this)">Easy</button>
                    <button class="fb-btn" onclick="app.selectFeedback('ok', this)">Okay</button>
                    <button class="fb-btn" onclick="app.selectFeedback('pain', this)">Pain</button>
                </div>

                <textarea id="user-notes" rows="2" placeholder="Notes (optional)..."></textarea>

                <div id="ai-analysis" style="display:none;"></div>
                
                <div style="margin-top: 20px;">
                    <button class="btn" id="analyze-btn" style="width:100%; font-size:1.1rem; padding:12px;" onclick="app.submitFeedback()">Analyze & Finish</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/wrist/script.js?v=3"></script>
</body>
</html>
